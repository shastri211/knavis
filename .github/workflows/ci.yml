name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      # Tests use an isolated data directory, blank API keys and a fake LLM:
      # no secrets and no network access are needed.
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  backend-postgres:
    name: Backend tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: knavis
          POSTGRES_PASSWORD: knavis
          POSTGRES_DB: knavis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knavis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      # The same suite, with the application database on PostgreSQL (keyword index, migrations, jobs, ownership).
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q
        env:
          DATABASE_URL: postgresql://knavis:knavis@127.0.0.1:5432/knavis

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker images and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
        env:
          KNAVIS_PORT: "18080"
      - name: Smoke test through the proxy
        run: |
          set -e
          base=http://127.0.0.1:18080
          curl -fsS "$base/" > /dev/null
          curl -fsS "$base/api/health"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/sessions")" = "401"
          token=$(curl -fsS -X POST "$base/api/auth/register" -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"a long ci passphrase"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          curl -fsS "$base/api/sessions" -H "Authorization: Bearer $token"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
