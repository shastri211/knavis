# Used by the `alembic` command line (run from the backend directory). The application itself runs the migrations at
# start-up (app/migrations.py). The database URL is taken from the app's settings (DATABASE_URL / DATA_DIR).
[alembic]
script_location = migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
