server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Must be at least MAX_UPLOAD_MB (plus form overhead); the backend enforces the real limit.
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # the backend's rate limits use it (TRUST_PROXY_HEADERS=true)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;                           # a chat turn can wait on a free-tier model
        proxy_request_buffering on;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
        add_header X-Frame-Options DENY;
    }
}
