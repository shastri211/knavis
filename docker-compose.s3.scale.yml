# Use together with docker-compose.s3.yml and docker-compose.scale.yml: gives the ingestion workers the same object store.
#   S3_SECRET_ACCESS_KEY=... POSTGRES_PASSWORD=... docker compose -f docker-compose.yml -f docker-compose.scale.yml \
#       -f docker-compose.s3.yml -f docker-compose.s3.scale.yml up --build --scale backend=2 --scale worker=2
services:
  worker:
    environment:
      STORAGE_BACKEND: s3
      S3_BUCKET: ${S3_BUCKET:-knavis}
      S3_ENDPOINT_URL: http://s3:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-knavis}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_PATH_STYLE: "true"
      S3_CREATE_BUCKET: "true"
    depends_on:
      s3:
        condition: service_healthy
